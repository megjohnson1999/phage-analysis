# Test configuration for phage-analysis pipeline
# Input files/directories
assembly_file: "test_data/assemblies/test_sample.fasta"
reads_dir: "test_data/reads"

# Database paths (use actual database paths)
databases:
  iphop:
    db: "/ref/sahlab/data/viral_analysis_DBs/iphop_DBs/Aug_2023_pub_rw"
  phabox:
    db: "/ref/sahlab/data/viral_analysis_DBs/phabox_db_v2"
  vcontact3:
    db: "/ref/sahlab/data/viral_analysis_DBs/vcontact3_DB223"
  mmseqs2:
    db: "/ref/sahlab/data/nr/nr_mmseqs15_DB"
  genomad:
    db: "/ref/sahlab/data/genomad_db"
  checkv:
    db: "/ref/sahlab/data/viral_analysis_DBs/checkV_DB/checkv-db-v1.5"
  phold:
    db: "/ref/sahlab/data/protein_Structure_DBs/phold"

# Analysis parameters
params:
  vclust:
    min_length: 10000
    identity: 95
    coverage: 85

# Output directory
output_dir: "test_data/results"

# Conda environments
# Use existing envs from main config
conda_envs:
  reneo: "/ref/sahlab/software/miniforge3/envs/reneo"
  mmseqs2: "/ref/sahlab/software/miniforge3/envs/mmseqs2_v15-6f452"
  jaeger: "/ref/sahlab/software/miniforge3/envs/jaeger"
  genomad: "/ref/sahlab/software/anaconda3/envs/genomad"
  phold: "/ref/sahlab/software/miniforge3/envs/pholdENV"
  checkv: "/ref/sahlab/software/anaconda3/envs/checkV"
  r: "/ref/sahlab/software/miniforge3/envs/R"
  vclust: "/ref/sahlab/software/miniforge3/envs/vclust"
  iphop: "/ref/sahlab/software/miniforge3/envs/iphop_env"
  phacts: "/ref/sahlab/software/miniforge3/envs/phacts"
  phabox2: "/ref/sahlab/software/miniforge3/envs/phabox2"
  seqkit: "../envs/seqkit.yaml"
  vcontact3: "/ref/sahlab/software/miniforge3/envs/vcontct3"
  python: "/ref/sahlab/software/miniforge3/envs/python3.9"