# Example Config: Starting from Viral Contigs
#
# USE THIS WHEN:
#   - You already have viral contigs (e.g., from MMseqs2 viral filtering)
#   - You want to run phage prediction tools on known viral sequences
#   - You want to skip the initial assembly filtering step
#
# SKIPS: Assembly filtering, MMseqs2 viral detection
# RUNS: Prediction (geNomad, Jaeger, PHOLD) → Clustering → Analysis

# Directory configuration
output_dir: "/path/to/your/project/outputs"

# Input files
reads_dir: "/path/to/reads"  # Required for abundance calculation

# Entry point configuration
start_from: "viral_contigs"
viral_contigs_file: "/path/to/your/viral_contigs.fasta"  # FASTA with viral contigs (min 1000bp)

# Pipeline flags
do_clustering: true  # Cluster predicted phages into vOTUs
generate_summaries: true
calculate_abundance: false
run_consensus: true
run_crassus: false
cleanup_temp_dirs: true
abundance_coverage_threshold: 0.75

# Database Configuration
# UPDATE THESE PATHS WITH YOUR LOCAL DATABASE LOCATIONS!
#
# Download commands:
#   genomad download-database /your/path/to/genomad_db
#   checkv download-database /your/path/to/checkv_db
#   iphop download --out_dir /your/path/to/iphop_db
databases:
  genomad:
    db: "/your/path/to/genomad_db"  # UPDATE THIS PATH!
  checkv:
    db: "/your/path/to/checkv_db"  # UPDATE THIS PATH!
  iphop:
    db: "/your/path/to/iphop_db"  # UPDATE THIS PATH!
  phabox:
    db: "/your/path/to/phabox_db"  # UPDATE THIS PATH!
  vcontact3:
    db: "/your/path/to/vcontact3_db"  # UPDATE THIS PATH!
  mmseqs2:
    db: "/your/path/to/mmseqs_nr_db"  # UPDATE THIS PATH!
  phold:
    db: "/your/path/to/phold_db"  # UPDATE THIS PATH!

# Conda environments (using default paths)
conda_envs:
  genomad: "../envs/genomad.yaml"
  jaeger: "../envs/jaeger.yaml"
  phold: "../envs/phold.yaml"
  checkv: "../envs/checkv.yaml"
  vclust: "../envs/vclust.yaml"
  iphop: "../envs/iphop.yaml"
  bacphlip: "../envs/bacphlip.yaml"
  phabox2: "../envs/phabox2.yaml"
  vcontact3: "../envs/vcontact3.yaml"
  mmseqs2: "../envs/mmseqs2.yaml"
  seqkit: "../envs/seqkit.yaml"
  python: "../envs/python.yaml"
  r: "../envs/r.yaml"
