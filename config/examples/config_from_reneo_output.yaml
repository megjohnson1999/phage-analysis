# Example Config: Starting from Reneo Output
#
# USE THIS WHEN:
#   - You already have Reneo-binned contigs from a previous run
#   - You want to skip the expensive Reneo binning step
#   - You want to run prediction, clustering, and analysis on pre-binned contigs
#
# SKIPS: Reneo binning
# RUNS: Prediction → Clustering → Analysis → Summaries

# Directory configuration
output_dir: "/path/to/your/project/outputs"

# Input files
reads_dir: "/path/to/reads"  # Still needed for some downstream steps

# Entry point configuration
start_from: "reneo_output"
reneo_output_file: "/path/to/your/reneo_contigs_1KB.fasta"  # FASTA with Reneo-binned contigs

# Pipeline flags
do_clustering: true
generate_summaries: true
calculate_abundance: false
run_consensus: true
run_crassus: false
cleanup_temp_dirs: true

# Database paths (example - update with your paths)
databases:
  genomad:
    db: "/ref/sahlab/data/viral_analysis_DBs/genomad_DBs/genomad_db"
  checkv:
    db: "/ref/sahlab/data/viral_analysis_DBs/checkV_DB/checkv-db-v1.5"
  iphop:
    db: "/ref/sahlab/data/viral_analysis_DBs/iphop_DBs/Aug_2023_pub_rw"
  phabox:
    db: "/ref/sahlab/data/viral_analysis_DBs/phabox_db_v2"
  vcontact3:
    db: "/ref/sahlab/data/viral_analysis_DBs/vcontact3_DB223"
  mmseqs2:
    db: "/ref/sahlab/data/nr/nr_mmseqs15_DB"

params:
  vclust:
    min_length: 10000
    identity: 0.95
    coverage: 0.85
