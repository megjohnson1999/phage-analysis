# Phage Analysis Pipeline Configuration

# NOTE: Default configuration uses HTCF setup
# To adapt for your own system:
# 1. Change conda_base_path to your conda installation (or set to "" for Snakemake handling)
# 2. Update database paths to your local copies
# 3. Adjust output_dir and input file paths

# Directory configuration
output_dir: "/path/to/your/project/outputs"  # Change to your actual output directory

# Optional: Conda configuration for existing environments
# If using existing conda environments (e.g., for Reneo with Gurobi license),
# specify the base path of your conda/mamba installation
conda_base_path: "/ref/sahlab/software/miniforge3"  # Set to "" to use Snakemake's conda handling

# Input files/directories
# Note: Provide either assembly_file OR assembly_graph (not both)
assembly_file: "/path/to/assembly.fasta"  # Path to assembly file for FASTA-only workflow
assembly_graph: ""   # Path to assembly graph file for Reneo workflow
reads_dir: "/path/to/reads"  # Directory containing sequencing reads

# ================================================================================
# Pipeline Entry Points
# ================================================================================
#
# The pipeline supports starting from different stages by providing pre-computed
# intermediate files. This allows you to skip expensive upstream steps.
#
# Entry Points:
#
#   "assembly" (default)
#     - Start from raw assembly file
#     - Runs: Assembly filtering → Prediction → Clustering → Analysis
#     - Requires: assembly_file OR assembly_graph
#
#   "reneo_output"
#     - Start from Reneo-binned contigs (skip Reneo step)
#     - Runs: Prediction → Clustering → Analysis
#     - Requires: reneo_output_file (FASTA, min 1000bp)
#     - Skips: Reneo binning
#
#   "viral_contigs"
#     - Start from viral contigs (skip MMseqs filtering)
#     - Runs: Prediction → Clustering → Analysis
#     - Requires: viral_contigs_file (FASTA, min 1000bp)
#     - Skips: Assembly filtering, MMseqs
#
#   "predicted_phages"
#     - Start from phage predictions (skip prediction tools)
#     - Runs: Clustering → Analysis
#     - Requires: predicted_phages_file (FASTA)
#     - Skips: Assembly filtering, prediction tools
#
#   "clustered_sequences"
#     - Start from clustered vOTUs (skip prediction & clustering)
#     - Runs: Analysis only
#     - Requires: clustered_sequences_file (FASTA of vOTU representatives)
#     - Skips: Assembly filtering, prediction, clustering
#
# ================================================================================

start_from: "assembly"  # Options: assembly, reneo_output, viral_contigs, predicted_phages, clustered_sequences

# Entry point input files (only provide the one that matches your start_from setting)
# reneo_output_file: "/path/to/reneo_contigs.fasta"
# viral_contigs_file: "/path/to/viral_contigs.fasta"
# predicted_phages_file: "/path/to/predicted_phages.fasta"
# clustered_sequences_file: "/path/to/vOTUs.fasta"

# Pipeline configuration
do_clustering: true  # Set to false to skip clustering
generate_summaries: true  # Set to false to skip summary report generation
run_consensus: true  # Set to false to skip taxonomic consensus
run_crassus: false  # Set to true to enable CrassUS for Crassvirales taxonomy (requires separate installation)
calculate_abundance: false  # Set to true to calculate per-sample abundance using CoverM
abundance_coverage_threshold: 0.75  # Minimum fraction of contig covered to count abundance (0.0-1.0)
cleanup_temp_dirs: true  # Set to false to keep intermediate temporary files (Reneo temp/work, iPhop tmp)

databases:
  iphop:
    db: "/ref/sahlab/data/viral_analysis_DBs/iphop_DBs/Aug_2023_pub_rw"
  
  phabox:
    db: "/ref/sahlab/data/viral_analysis_DBs/phabox_db_v2"
    
  vcontact3:
    db: "/ref/sahlab/data/viral_analysis_DBs/vcontact3_DB223"
  
  mmseqs2:
    db: "/ref/sahlab/data/nr/nr_mmseqs15_DB"
  
  genomad:
    db: "/ref/sahlab/data/viral_analysis_DBs/genomad_DBs/genomad_db"
  
  checkv:
    db: "/ref/sahlab/data/viral_analysis_DBs/checkV_DB/checkv-db-v1.5"
  
  phold:
    db: "/ref/sahlab/data/protein_Structure_DBs/phold"
    
  crassus:
    db: "/ref/sahlab/software/CrassUS"  # Path to CrassUS installation directory
  
  taxonomizr:
    db: "/ref/sahlab/data/accessionTaxa.sql"  # Path to taxonomizr SQLite database file
    
params:    
  vclust:
    min_length: 10000
    identity: 0.95
    coverage: 0.85


# Conda environments
conda_envs:
   reneo: "reneo"  # Environment name when using conda_base_path
   #reneo: "../envs/reneo.yaml"  # Alternative: create new env (requires Gurobi license setup)
   mmseqs2: "../envs/mmseqs2.yaml"
   jaeger: "../envs/jaeger.yaml"
   #jaeger: "/ref/sahlab/software/miniforge3/envs/jaeger"
   genomad: "../envs/genomad.yaml"
   phold: "../envs/phold.yaml"
   checkv: "../envs/checkv.yaml"
   r: "../envs/r.yaml"
   vclust: "../envs/vclust.yaml"
   iphop: "../envs/iphop.yaml"
   bacphlip: "../envs/bacphlip.yaml"
   phabox2: "../envs/phabox2.yaml"
   seqkit: "../envs/seqkit.yaml"
   vcontact3: "../envs/vcontact3.yaml"
   python: "../envs/python.yaml"
   crassus: "../envs/crassus.yaml"
   coverm: "../envs/coverm.yaml"
