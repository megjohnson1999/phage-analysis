name: phacts
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - python>=3.7
  - pandas
  - numpy
  - biopython
  - scikit-learn=0.24
  - matplotlib
  - prodigal
  - git  # Required for installation
  - pip
  - pip:
    - libsvm
    # PHACTS is installed by the Snakemake workflow
    # No need to install manually