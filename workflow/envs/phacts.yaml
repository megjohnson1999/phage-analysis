name: phacts
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - python>=3.7
  - pandas
  - numpy
  - biopython
  - scikit-learn=0.24
  - matplotlib
  - prodigal
  - git  # Required for installation
  - pip
  - pip:
    - libsvm
    - "phacts"
  # Set environment variable to allow deprecated sklearn package
  variables:
    SKLEARN_ALLOW_DEPRECATED_SKLEARN_PACKAGE_INSTALL: "True"
    # Installing PHACTS directly through pip
    # No more manual installation needed