name: phacts
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - python>=3.7
  - pandas
  - numpy
  - biopython
  - scikit-learn=0.24
  - matplotlib
  - prodigal
  - pip
  - pip:
    - libsvm
    # PHACTS itself needs to be installed manually from source
    # Download from https://sourceforge.net/projects/phacts/
    # or clone from https://github.com/deprekate/PHACTS
    # Install to a path in your conda environment